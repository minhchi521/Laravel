services:
    app:
        build: .
        restart: unless-stopped
        volumes:
            - ./:/var/www
        working_dir: /var/www

    nginx:
        image: nginx:alpine
        container_name: laravel-nginx
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
    tunnel:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel --no-autoupdate --url http://nginx:80
        depends_on:
            - nginx
