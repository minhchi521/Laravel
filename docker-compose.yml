services:
    app:
        build: .
        container_name: laravel-app
        restart: unless-stopped
        volumes:
            - ./:/var/www
        working_dir: /var/www

    nginx:
        image: nginx:alpine
        container_name: laravel-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
